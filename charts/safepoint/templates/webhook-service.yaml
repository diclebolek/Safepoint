{{- if .Values.webhook.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: backup-operator-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: safepoint
spec:
  ports:
    - port: 443
      targetPort: {{ .Values.webhook.port }}
      name: https
  selector:
    app.kubernetes.io/name: safepoint
    app.kubernetes.io/component: operator
{{- end }}
