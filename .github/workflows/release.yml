# =============================================================================
# Bu dosya ne ise yarar?
#   main/tag push'ta operator + backup image'larini GHCR'a yayinlar ve cosign imzalar.
# =============================================================================

name: release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_OPERATOR: ghcr.io/${{ github.repository_owner }}/safepoint-operator
  IMAGE_BACKUP: ghcr.io/${{ github.repository_owner }}/safepoint-backup

jobs:
  publish:
    name: publish-ghcr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (operator)
        id: meta_op
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_OPERATOR }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push operator
        id: build_op
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta_op.outputs.tags }}
          labels: ${{ steps.meta_op.outputs.labels }}

      - name: Docker meta (backup)
        id: meta_bk
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BACKUP }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push backup image
        id: build_bk
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backup
          push: true
          tags: ${{ steps.meta_bk.outputs.tags }}
          labels: ${{ steps.meta_bk.outputs.labels }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign images
        env:
          DIGEST_OP: ${{ steps.build_op.outputs.digest }}
          DIGEST_BK: ${{ steps.build_bk.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE_OPERATOR}@${DIGEST_OP}"
          cosign sign --yes "${IMAGE_BACKUP}@${DIGEST_BK}"
