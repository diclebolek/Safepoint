name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./... -count=1 -race

      - name: Envtest
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
          export KUBEBUILDER_ASSETS="$(setup-envtest use -p path)"
          go test ./internal/controller -tags=envtest -count=1 -v

      - name: Build binaries
        run: |
          go build -o bin/manager ./cmd
          go build -o bin/dashboard ./cmd/dashboard

      - name: Helm lint
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm lint charts/safepoint

      - name: Generate webhook certs
        run: go run ./scripts/gencerts -out config/webhook/certs

  docker:
    name: docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t backup-operator:ci .
          docker build -t safepoint-backup:ci -f Dockerfile.backup .
          docker build -t safepoint-dashboard:ci -f Dockerfile.dashboard .
