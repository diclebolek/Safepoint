# =============================================================================
# Bu dosya ne ise yarar?
#   Operator'un Kubernetes API'sinde neye izinli oldugunu tanimlar
#   (BackupSchedule okuma/yazma, Job olusturma, Secret okuma, vb.).
#
# ServiceAccount backup-operator -> ClusterRole -> ClusterRoleBinding.
# Uygulama: kubectl apply -f config/rbac/role.yaml
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-operator
  namespace: backup-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backup-operator
rules:
  - apiGroups: ["backup.goproject.io"]
    resources: ["backupschedules", "backuprestores", "destinationprofiles"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["backup.goproject.io"]
    resources: ["backupschedules/status", "backuprestores/status", "destinationprofiles/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["backup.goproject.io"]
    resources: ["backupschedules/finalizers", "backuprestores/finalizers", "destinationprofiles/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backup-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backup-operator
subjects:
  - kind: ServiceAccount
    name: backup-operator
    namespace: backup-system
