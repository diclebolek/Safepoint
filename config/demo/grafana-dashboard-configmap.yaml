apiVersion: v1
kind: ConfigMap
metadata:
  name: safepoint-grafana-dashboard
  namespace: demo
  labels:
    grafana_dashboard: "1"
data:
  safepoint.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "title": "Backup successes (total)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": { "unit": "short", "min": 0 },
            "overrides": []
          },
          "targets": [
            {
              "expr": "safepoint_backup_success_total",
              "legendFormat": "{{engine}} / {{schedule}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Backup failures (total)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": {
            "defaults": { "unit": "short", "min": 0 },
            "overrides": []
          },
          "targets": [
            {
              "expr": "safepoint_backup_failure_total",
              "legendFormat": "{{engine}} / {{schedule}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Backup duration seconds (last observed sum/count)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "fieldConfig": {
            "defaults": { "unit": "s", "min": 0 },
            "overrides": []
          },
          "targets": [
            {
              "expr": "safepoint_backup_duration_seconds_sum / safepoint_backup_duration_seconds_count",
              "legendFormat": "{{engine}} avg",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Restore successes",
          "type": "stat",
          "gridPos": { "h": 4, "w": 12, "x": 0, "y": 16 },
          "fieldConfig": {
            "defaults": { "unit": "short", "min": 0 },
            "overrides": []
          },
          "targets": [
            { "expr": "sum(safepoint_restore_success_total) or vector(0)", "legendFormat": "restores", "refId": "A" }
          ]
        },
        {
          "title": "Restore failures",
          "type": "stat",
          "gridPos": { "h": 4, "w": 12, "x": 12, "y": 16 },
          "fieldConfig": {
            "defaults": { "unit": "short", "min": 0 },
            "overrides": []
          },
          "targets": [
            { "expr": "sum(safepoint_restore_failure_total) or vector(0)", "legendFormat": "failures", "refId": "A" }
          ]
        }
      ],
      "schemaVersion": 39,
      "tags": ["safepoint", "backup", "kubernetes"],
      "templating": { "list": [] },
      "time": { "from": "now-6h", "to": "now" },
      "title": "Safepoint Backups",
      "uid": "safepoint-backups",
      "version": 2
    }
    