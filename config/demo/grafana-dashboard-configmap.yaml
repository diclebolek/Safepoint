# Purpose: Grafana dashboard JSON for Safepoint (provisioned into Grafana).
# Used by: config/demo/observability.yaml (mounted at /var/lib/grafana/dashboards).
apiVersion: v1
kind: ConfigMap
metadata:
  name: safepoint-grafana-dashboard
  namespace: demo
  labels:
    grafana_dashboard: "1"
data:
  safepoint.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "title": "Postgres backup successes",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": { "unit": "short", "min": 0, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] } },
            "overrides": []
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "area" },
          "targets": [
            {
              "expr": "sum(safepoint_backup_success_total{engine=\"postgres\"}) or vector(0)",
              "legendFormat": "postgres",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Redis backup successes",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "fieldConfig": {
            "defaults": { "unit": "short", "min": 0, "thresholds": { "mode": "absolute", "steps": [{ "color": "yellow", "value": null }] } },
            "overrides": []
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "area" },
          "targets": [
            {
              "expr": "sum(safepoint_backup_success_total{engine=\"redis\"}) or vector(0)",
              "legendFormat": "redis",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Backup failures",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "fieldConfig": {
            "defaults": { "unit": "short", "min": 0, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] } },
            "overrides": []
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [
            {
              "expr": "sum(safepoint_backup_failure_total) or vector(0)",
              "legendFormat": "failures",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Restore successes",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "fieldConfig": {
            "defaults": { "unit": "short", "min": 0 },
            "overrides": []
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" },
          "targets": [
            { "expr": "sum(safepoint_restore_success_total) or vector(0)", "legendFormat": "restores", "refId": "A" }
          ]
        },
        {
          "title": "Backup successes over time",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 4 },
          "fieldConfig": {
            "defaults": { "unit": "short", "min": 0 },
            "overrides": []
          },
          "targets": [
            {
              "expr": "safepoint_backup_success_total",
              "legendFormat": "{{engine}} / {{schedule}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Backup job duration (avg seconds)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 12 },
          "fieldConfig": {
            "defaults": { "unit": "s", "min": 0 },
            "overrides": []
          },
          "targets": [
            {
              "expr": "safepoint_backup_duration_seconds_sum / clamp_min(safepoint_backup_duration_seconds_count, 1)",
              "legendFormat": "{{engine}}",
              "refId": "A"
            }
          ]
        }
      ],
      "schemaVersion": 39,
      "tags": ["safepoint", "backup", "kubernetes"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "title": "Safepoint Backups",
      "uid": "safepoint-backups",
      "version": 3
    }
    