# =============================================================================
# Bu dosya ne ise yarar?
#   Demo ortaminda HANGI veritabanlarinin NE SIKLIKLA yedeklenecegini tanimlar.
#   Her "BackupSchedule" = 1 veritabani. Iki blok = Postgres + Redis.
#
# Kim kullanir?
#   Safepoint operatoru bu CR'lari izler; zaman gelince Kubernetes Job acar.
#
# Ne degistirilir?
#   - spec.schedule  -> ne siklikla (ornek: "*/5 * * * *" = 5 dk, "0 2 * * *" = gece 02:00)
#   - secretRef      -> hangi Secret'tan DB sifresi/host okunacak
#   - destination    -> yedek dosyasi nereye yuklenecek (MinIO/S3)
#   Yeni DB eklemek  -> asagiya yeni bir BackupSchedule blogu kopyala
#
# Uygulama:
#   kubectl apply -f config/demo/backupschedules.yaml
#   kubectl -n demo get bks
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: demo
type: Opaque
stringData:
  # Keys used to talk to the demo object store (MinIO/SeaweedFS).
  accessKey: minioadmin
  secretKey: minioadmin
---
# --- Database #1: Postgres "shop" ---
apiVersion: backup.goproject.io/v1
kind: BackupSchedule
metadata:
  name: shop-db-backup
  namespace: demo
spec:
  # Which dump tool to use: postgres | mysql | redis | mongodb
  engine: postgres
  # Logical name (must match webhook annotation backup.goproject.io/database-name if used)
  databaseRef: shop-postgres
  # Secret that contains host/user/password/database for THIS db
  secretRef: shop-postgres-credentials
  # HOW OFTEN this DB is backed up (change me to change frequency)
  schedule: "*/5 * * * *" # every 5 minutes
  # Delete objects older than N days from the bucket
  retentionDays: 7
  destination:
    # Where to upload the .dump.gz file
    endpoint: minio.demo.svc.cluster.local:9000
    bucket: db-backups
    prefix: postgres/shop
    region: us-east-1
    credentialsSecretRef: minio-credentials
    useSSL: false
---
# --- Database #2: Redis "shop" (second schedule = second DB) ---
apiVersion: backup.goproject.io/v1
kind: BackupSchedule
metadata:
  name: shop-redis-backup
  namespace: demo
spec:
  engine: redis
  databaseRef: shop-redis
  secretRef: shop-redis-credentials
  schedule: "*/10 * * * *" # every 10 minutes -- change this string to change frequency
  retentionDays: 3
  destination:
    endpoint: minio.demo.svc.cluster.local:9000
    bucket: db-backups
    prefix: redis/shop
    region: us-east-1
    credentialsSecretRef: minio-credentials
    useSSL: false
