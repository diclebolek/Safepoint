apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: demo
type: Opaque
stringData:
  # SeaweedFS default S3 credentials (dev only)
  accessKey: any
  secretKey: any
---
# SeaweedFS all-in-one (master + volume + filer + S3 on :8333)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: demo
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:latest
          imagePullPolicy: IfNotPresent
          args:
            - "server"
            - "-dir=/data"
            - "-s3"
            - "-s3.port=9000"
            - "-master.volumeSizeLimitMB=100"
          ports:
            - containerPort: 9000
              name: s3
            - containerPort: 9333
              name: master
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: demo
spec:
  selector:
    app: minio
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
---
# Create bucket via SeaweedFS S3 API (awscli-compatible curl/sigv4 is heavy;
# filer mkdir via weed shell is simpler for demo).
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: demo
spec:
  ttlSecondsAfterFinished: 180
  backoffLimit: 8
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-bucket
          image: chrislusf/seaweedfs:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              echo "waiting for s3..."
              for i in $(seq 1 60); do
                if wget -q -O- http://minio:9000/ >/dev/null 2>&1 || true; then
                  break
                fi
                sleep 2
              done
              # SeaweedFS creates buckets on first PUT when configured; ensure via weed shell filer path
              echo 's3.bucket.create -name db-backups' | weed shell -master=minio:9333 || true
              echo "bucket ensure attempted"
