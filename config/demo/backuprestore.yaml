# =============================================================================
# Bu dosya ne ise yarar?
#   Demo Postgres icin BackupRestore ornegi. objectKey, canlı cluster'dan
#   doldurulur (asagidaki PowerShell) veya son basarili dump key'i elle yazilir.
#
# Canli doldur + uygula:
#   $key = kubectl -n demo get bks shop-db-backup -o jsonpath="{.status.lastObjectKey}"
#   (Get-Content config\demo\backuprestore.yaml) -replace 'REPLACE_WITH_LAST_OBJECT_KEY',$key |
#     kubectl apply -f -
#   kubectl -n demo get bkr shop-db-restore -w
# =============================================================================

apiVersion: backup.goproject.io/v1
kind: BackupRestore
metadata:
  name: shop-db-restore
  namespace: demo
  labels:
    app.kubernetes.io/part-of: safepoint
spec:
  engine: postgres
  secretRef: shop-postgres-credentials
  # Filled by demo script / replace manually from BackupSchedule.status.lastObjectKey
  objectKey: REPLACE_WITH_LAST_OBJECT_KEY
  destinationRef: demo-minio
