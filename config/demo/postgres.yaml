# =============================================================================
# Bu dosya ne ise yarar?
#   Demo Postgres veritabanini (Deployment) ve baglanti Secret'ini olusturur.
#   Secret icinde host/user/password/database vardir; BackupSchedule bunu kullanir.
#
# Kim kullanir?
#   shop-db-backup schedule'i secretRef: shop-postgres-credentials ile buraya bakar.
#
# Ne degistirilir?
#   stringData.host / password / database  -> gercek DB adresin
#   Label require-backup=true             -> webhook yedeksiz deploy'u reddeder
#
# Uygulama: kubectl apply -f config/demo/postgres.yaml
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: shop-postgres-credentials
  namespace: demo
type: Opaque
stringData:
  username: postgres
  password: postgres
  database: shop # DB name inside the Postgres server
  host: shop-postgres.demo.svc.cluster.local # Service DNS inside the cluster
  port: "5432"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-postgres
  namespace: demo
  labels:
    app: shop-postgres
    backup.goproject.io/require-backup: "true"
  annotations:
    backup.goproject.io/database-name: shop-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop-postgres
  template:
    metadata:
      labels:
        app: shop-postgres
        backup.goproject.io/require-backup: "true"
      annotations:
        backup.goproject.io/database-name: shop-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shop-postgres-credentials
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: shop-postgres-credentials
                  key: database
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: shop-postgres-credentials
                  key: username
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shop-postgres
  namespace: demo
spec:
  selector:
    app: shop-postgres
  ports:
    - port: 5432
      targetPort: 5432
