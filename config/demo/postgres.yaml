# =============================================================================
# Bu dosya ne ise yarar?
#   Demo Postgres veritabanini (Deployment) ve baglanti Secret'ini olusturur.
#   Secret icinde host/user/password/database vardir; BackupSchedule bunu kullanir.
#
# Kim kullanir?
#   shop-db-backup schedule'i secretRef: shop-postgres-credentials ile buraya bakar.
#
# Ne degistirilir?
#   stringData.host / password / database  -> gercek DB adresin
#   Label require-backup=true             -> webhook yedeksiz deploy'u reddeder
#
# Uygulama: kubectl apply -f config/demo/postgres.yaml
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: shop-postgres-credentials
  namespace: demo
type: Opaque
stringData:
  username: postgres
  password: postgres
  database: shop # DB name inside the Postgres server
  host: shop-postgres.demo.svc.cluster.local # Service DNS inside the cluster
  port: "5432"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-postgres
  namespace: demo
  labels:
    app: shop-postgres
    backup.goproject.io/require-backup: "true"
  annotations:
    backup.goproject.io/database-name: shop-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop-postgres
  template:
    metadata:
      labels:
        app: shop-postgres
        backup.goproject.io/require-backup: "true"
      annotations:
        backup.goproject.io/database-name: shop-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          args:
            - postgres
            - -c
            - wal_level=replica
            - -c
            - max_wal_senders=5
            - -c
            - max_replication_slots=5
            - -c
            - hot_standby=on
            - -c
            - archive_mode=off
            - -c
            - hba_file=/etc/postgresql/pg_hba.conf
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shop-postgres-credentials
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: shop-postgres-credentials
                  key: database
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: shop-postgres-credentials
                  key: username
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pg-hba
              mountPath: /etc/postgresql
            - name: pg-init
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: pg-hba
          configMap:
            name: shop-postgres-hba
        - name: pg-init
          configMap:
            name: shop-postgres-init
---
# Allow app + replication connections (demo only — open CIDR).
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-postgres-hba
  namespace: demo
data:
  pg_hba.conf: |
    local   all             all                                     trust
    host    all             all             0.0.0.0/0               scram-sha-256
    host    all             all             ::/0                    scram-sha-256
    host    replication     replicator      0.0.0.0/0               scram-sha-256
    host    replication     replicator      ::/0                    scram-sha-256
---
# Creates replication role for pg_receivewal (runs only on first empty data dir).
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-postgres-init
  namespace: demo
data:
  01-replicator.sql: |
    DO $$
    BEGIN
      IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'replicator') THEN
        CREATE ROLE replicator WITH REPLICATION LOGIN PASSWORD 'replicator';
      END IF;
    END
    $$;
---
apiVersion: v1
kind: Service
metadata:
  name: shop-postgres
  namespace: demo
spec:
  selector:
    app: shop-postgres
  ports:
    - port: 5432
      targetPort: 5432
