# Purpose: Expose operator Prometheus metrics on port 8080 inside the cluster.
# Used by: Prometheus scrape job in config/demo/observability.yaml.
apiVersion: v1
kind: Service
metadata:
  name: backup-operator-metrics
  namespace: backup-system
  labels:
    app.kubernetes.io/name: backup-operator
    app.kubernetes.io/component: metrics
spec:
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
  selector:
    app.kubernetes.io/name: backup-operator
