# =============================================================================
# Bu dosya ne ise yarar?
#   Operator metriklerini cluster icinden HTTP :8080/metrics olarak yayinlar.
#   Prometheus bu Service'i scrape eder (observability.yaml icinde hedef adres).
# Uygulama: kubectl apply -f config/metrics/service.yaml
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: backup-operator-metrics
  namespace: backup-system
  labels:
    app.kubernetes.io/name: backup-operator
    app.kubernetes.io/component: metrics
spec:
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
  selector:
    app.kubernetes.io/name: backup-operator
