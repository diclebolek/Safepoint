# =============================================================================
# Bu dosya ne ise yarar? (ORNEK)
#   Bucket'taki bir yedek dosyasini (objectKey) tekrar DB'ye yuklemek icin.
#   objectKey'i su komuttan al:
#     kubectl get bks <isim> -n <ns> -o jsonpath="{.status.lastObjectKey}"
# Uygulama: kubectl apply -f config/samples/backuprestore.yaml
# =============================================================================

apiVersion: backup.goproject.io/v1
kind: BackupRestore
metadata:
  name: shop-db-restore
  namespace: demo
spec:
  engine: postgres
  secretRef: shop-postgres-credentials
  # Fill from: kubectl -n demo get bks shop-db-backup -o jsonpath="{.status.lastObjectKey}{'\n'}"
  objectKey: REPLACE_WITH_LAST_OBJECT_KEY
  destination:
    endpoint: minio.demo.svc.cluster.local:9000
    bucket: db-backups
    credentialsSecretRef: minio-credentials
    useSSL: false
  # If objectKey ends with .enc, set:
  # encryption:
  #   enabled: true
  #   secretRef: backup-encryption-key
