# =============================================================================
# Bu dosya ne ise yarar? (ORNEK / sablon)
#   "Su DB'yi su siklikla su dolaba yedekle" politikasi.
#   Bir BackupSchedule = bir DB. Ikinci DB icin blogu kopyala / yeni dosya yaz.
#
# Kritik alanlar:
#   schedule   -> ne siklikla (cron UTC)
#   secretRef  -> secrets.yaml'daki Secret adi
#   destination / destinationRef -> yedek nereye gidecek
# Uygulama: kubectl apply -f config/samples/backupschedule.yaml
# =============================================================================

apiVersion: backup.goproject.io/v1
kind: BackupSchedule
metadata:
  name: shop-db-backup
  namespace: default
spec:
  engine: postgres # postgres | mysql | redis | mongodb
  databaseRef: shop-postgres
  secretRef: shop-postgres-credentials # must exist in same namespace
  schedule: "*/5 * * * *" # HOW OFTEN -- cron UTC. Example nightly: "0 2 * * *"
  retentionDays: 7 # keep objects this many days
  suspend: false # true = pause new backups
  # mode: incremental   # first run auto-promotes to full; later runs chain via status.lastFullObjectKey
  # destinationRef: demo-minio   # OR inline destination below
  destination:
    endpoint: minio.minio.svc.cluster.local:9000
    bucket: db-backups
    prefix: postgres/shop
    region: us-east-1
    credentialsSecretRef: minio-credentials
    useSSL: false
---
apiVersion: backup.goproject.io/v1
kind: BackupSchedule
metadata:
  name: shop-redis-backup
  namespace: default
spec:
  engine: redis
  databaseRef: shop-redis
  secretRef: shop-redis-credentials
  schedule: "*/10 * * * *" # every 10 minutes
  retentionDays: 3
  destination:
    endpoint: minio.minio.svc.cluster.local:9000
    bucket: db-backups
    prefix: redis/shop
    region: us-east-1
    credentialsSecretRef: minio-credentials
    useSSL: false
