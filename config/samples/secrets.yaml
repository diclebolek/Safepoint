# Purpose: EXAMPLE Secrets for DB + MinIO + optional encryption passphrase.
# Used by: Copy/edit then kubectl apply -- replace CHANGE_ME values before real use.
# Demo secrets -- replace values before any real cluster use.
apiVersion: v1
kind: Secret
metadata:
  name: shop-postgres-credentials
  namespace: default
type: Opaque
stringData:
  username: postgres
  password: CHANGE_ME
  database: shop
  host: shop-postgres.default.svc.cluster.local
  port: "5432"
---
apiVersion: v1
kind: Secret
metadata:
  name: shop-redis-credentials
  namespace: default
type: Opaque
stringData:
  host: shop-redis.default.svc.cluster.local
  port: "6379"
  password: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: default
type: Opaque
stringData:
  accessKey: minioadmin
  secretKey: minioadmin
---
apiVersion: v1
kind: Secret
metadata:
  name: backup-encryption-key
  namespace: default
type: Opaque
stringData:
  # Passphrase for optional AES-256-CBC client-side encryption
  password: CHANGE_ME_ENCRYPTION_PASSPHRASE
