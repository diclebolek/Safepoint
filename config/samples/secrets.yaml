# Demo secrets — replace values before any real cluster use.
apiVersion: v1
kind: Secret
metadata:
  name: shop-postgres-credentials
  namespace: default
type: Opaque
stringData:
  username: postgres
  password: CHANGE_ME
  database: shop
  host: shop-postgres.default.svc.cluster.local
  port: "5432"
---
apiVersion: v1
kind: Secret
metadata:
  name: shop-redis-credentials
  namespace: default
type: Opaque
stringData:
  host: shop-redis.default.svc.cluster.local
  port: "6379"
  password: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: default
type: Opaque
stringData:
  accessKey: minioadmin
  secretKey: minioadmin
