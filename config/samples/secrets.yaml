# =============================================================================
# Bu dosya ne ise yarar? (ORNEK / sablon)
#   Kendi DB'ni yedeklemek isteyen birinin ILK duzenledigi dosya budur.
#   host, password, database = hangi sunucuya baglanilacak.
#
# Ayrica MinIO/S3 erisim anahtarlari ve opsiyonel sifreleme passphrase.
# Degistir CHANGE_ME, sonra: kubectl apply -f config/samples/secrets.yaml
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: shop-postgres-credentials
  namespace: default
type: Opaque
stringData:
  username: postgres
  password: CHANGE_ME # <-- change
  database: shop # <-- which database name inside Postgres
  host: shop-postgres.default.svc.cluster.local # <-- where the DB lives
  port: "5432"
---
apiVersion: v1
kind: Secret
metadata:
  name: shop-redis-credentials
  namespace: default
type: Opaque
stringData:
  host: shop-redis.default.svc.cluster.local
  port: "6379"
  password: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: default
type: Opaque
stringData:
  # Object storage (S3) login -- not the database password
  accessKey: minioadmin
  secretKey: minioadmin
---
apiVersion: v1
kind: Secret
metadata:
  name: backup-encryption-key
  namespace: default
type: Opaque
stringData:
  # Optional: only needed if BackupSchedule.spec.encryption.enabled=true
  password: CHANGE_ME_ENCRYPTION_PASSPHRASE
