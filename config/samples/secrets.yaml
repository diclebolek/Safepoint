# Purpose: EXAMPLE Secrets for DB + MinIO + optional encryption passphrase.
# Used by: Copy/edit then kubectl apply -- replace CHANGE_ME values before real use.
#
# This is usually the FIRST file a new user edits:
#   host / port / username / password / database  = which real DB to talk to
#
apiVersion: v1
kind: Secret
metadata:
  name: shop-postgres-credentials
  namespace: default
type: Opaque
stringData:
  username: postgres
  password: CHANGE_ME # <-- change
  database: shop # <-- which database name inside Postgres
  host: shop-postgres.default.svc.cluster.local # <-- where the DB lives
  port: "5432"
---
apiVersion: v1
kind: Secret
metadata:
  name: shop-redis-credentials
  namespace: default
type: Opaque
stringData:
  host: shop-redis.default.svc.cluster.local
  port: "6379"
  password: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: default
type: Opaque
stringData:
  # Object storage (S3) login -- not the database password
  accessKey: minioadmin
  secretKey: minioadmin
---
apiVersion: v1
kind: Secret
metadata:
  name: backup-encryption-key
  namespace: default
type: Opaque
stringData:
  # Optional: only needed if BackupSchedule.spec.encryption.enabled=true
  password: CHANGE_ME_ENCRYPTION_PASSPHRASE
