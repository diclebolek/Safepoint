# Purpose: EXAMPLE reusable S3 destination (DestinationProfile / shortName bdp).
# Used by: BackupSchedule.spec.destinationRef instead of repeating inline destination.
apiVersion: backup.goproject.io/v1
kind: DestinationProfile
metadata:
  name: demo-minio
  namespace: demo
spec:
  endpoint: minio.demo.svc.cluster.local:9000
  bucket: db-backups
  region: us-east-1
  credentialsSecretRef: minio-credentials
  useSSL: false
