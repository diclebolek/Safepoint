# =============================================================================
# Bu dosya ne ise yarar? (ORNEK)
#   S3/MinIO adresini bir kez tanimla; birden fazla BackupSchedule destinationRef
#   ile ayni dolabi kullansin (tekrar tekrar endpoint yazma).
# Uygulama: kubectl apply -f config/samples/destinationprofile.yaml
# =============================================================================

apiVersion: backup.goproject.io/v1
kind: DestinationProfile
metadata:
  name: demo-minio
  namespace: demo
spec:
  endpoint: minio.demo.svc.cluster.local:9000
  bucket: db-backups
  region: us-east-1
  credentialsSecretRef: minio-credentials
  useSSL: false
