# =============================================================================
# Bu dosya ne ise yarar? (ORNEK)
#   Webhook test ornegi: require-backup etiketi var.
#   Ayni database-name icin aktif BackupSchedule yoksa create/update REDDEDILIR.
# =============================================================================

apiVersion: v1
kind: Pod
metadata:
  name: shop-postgres
  namespace: default
  labels:
    backup.goproject.io/require-backup: "true"
  annotations:
    backup.goproject.io/database-name: shop-postgres
spec:
  containers:
    - name: postgres
      image: postgres:16-alpine
      env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: shop-postgres-credentials
              key: password
      ports:
        - containerPort: 5432
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      securityContext:
        allowPrivilegeEscalation: false
