# Purpose: ClusterIP Service for the validating admission webhook (TLS on 443->9443).
# Used by: ValidatingWebhookConfiguration + operator webhook server.
apiVersion: v1
kind: Service
metadata:
  name: backup-operator-webhook
  namespace: backup-system
  labels:
    app.kubernetes.io/name: backup-operator
spec:
  ports:
    - port: 443
      targetPort: 9443
      protocol: TCP
      name: https
  selector:
    app.kubernetes.io/name: backup-operator
