# =============================================================================
# Bu dosya ne ise yarar?
#   Admission webhook icin ClusterIP Service (API server -> operator TLS 9443).
#   Yedeksiz Deployment/Pod engelleme bu kanal uzerinden calisir.
# Uygulama: kubectl apply -f config/webhook/service.yaml
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: backup-operator-webhook
  namespace: backup-system
  labels:
    app.kubernetes.io/name: backup-operator
spec:
  ports:
    - port: 443
      targetPort: 9443
      protocol: TCP
      name: https
  selector:
    app.kubernetes.io/name: backup-operator
