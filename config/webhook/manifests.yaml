# =============================================================================
# Bu dosya ne ise yarar?
#   ValidatingWebhookConfiguration: API server, etiketli kayitlari operator'e sorar.
#   require-backup=true olan ama aktif BackupSchedule'i olmayan istek REDDEDILIR.
# Not: caBundle genelde scripts/gen-webhook-certs.ps1 ile doldurulur.
# =============================================================================

apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: backup-operator-validating
webhooks:
  - name: pod.backup.goproject.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: backup-operator-webhook
        namespace: backup-system
        path: /validate-v1-pod
      caBundle: Cg==
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
        scope: Namespaced
    failurePolicy: Fail
    sideEffects: None
    timeoutSeconds: 10
    matchPolicy: Equivalent
    # Do not intercept the operator's own namespace (avoids install chicken-egg).
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["backup-system", "kube-system", "kube-public"]
  - name: deployment.backup.goproject.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: backup-operator-webhook
        namespace: backup-system
        path: /validate-v1-deployment
      caBundle: Cg==
    rules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
        scope: Namespaced
    failurePolicy: Fail
    sideEffects: None
    timeoutSeconds: 10
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["backup-system", "kube-system", "kube-public"]
