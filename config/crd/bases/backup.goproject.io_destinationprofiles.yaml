# =============================================================================
# Bu dosya ne ise yarar?
#   DestinationProfile CRD semasi (paylasilan S3 hedefi). shortName: bdp
# Uygulama: kubectl apply -f config/crd/bases/
# =============================================================================

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: destinationprofiles.backup.goproject.io
spec:
  group: backup.goproject.io
  names:
    kind: DestinationProfile
    listKind: DestinationProfileList
    plural: destinationprofiles
    shortNames: [bdp]
    singular: destinationprofile
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Endpoint
          type: string
          jsonPath: .spec.endpoint
        - name: Bucket
          type: string
          jsonPath: .spec.bucket
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: { type: string }
            kind: { type: string }
            metadata: { type: object }
            spec:
              type: object
              required: [endpoint, bucket, credentialsSecretRef]
              properties:
                endpoint: { type: string }
                bucket: { type: string }
                prefix: { type: string }
                region: { type: string }
                credentialsSecretRef: { type: string }
                useSSL: { type: boolean }
            status:
              type: object
              properties:
                message: { type: string }
