apiVersion: v1
kind: ServiceAccount
metadata:
  name: safepoint-dashboard
  namespace: backup-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: safepoint-dashboard
rules:
  - apiGroups: ["backup.goproject.io"]
    resources: ["backupschedules", "backuprestores"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: safepoint-dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: safepoint-dashboard
subjects:
  - kind: ServiceAccount
    name: safepoint-dashboard
    namespace: backup-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safepoint-dashboard
  namespace: backup-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: safepoint-dashboard
  template:
    metadata:
      labels:
        app: safepoint-dashboard
    spec:
      serviceAccountName: safepoint-dashboard
      containers:
        - name: dashboard
          image: safepoint-dashboard:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8088
          env:
            - name: ADDR
              value: ":8088"
---
apiVersion: v1
kind: Service
metadata:
  name: safepoint-dashboard
  namespace: backup-system
spec:
  selector:
    app: safepoint-dashboard
  ports:
    - port: 8088
      targetPort: 8088
